name: Daily News Agents

on:
  schedule:
    # 04:00 UTC = 07:00 Riyadh time, every day
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Which agent to run'
        required: false
        default: 'both'
        type: choice
        options: [both, ai-news, saudi-stocks]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 'both' for scheduled runs and pushes; the chosen agent for manual runs
      AGENT: ${{ github.event.inputs.agent || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # continue-on-error so one failed agent doesn't block publishing the
      # site (it falls back to the previously committed reports)
      - name: Run AI news agent
        continue-on-error: true
        if: env.AGENT == 'both' || env.AGENT == 'ai-news'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if node -e "process.exit(require('./config.json').agents['ai-news'] === false ? 1 : 0)"; then
            node ai-news-agent.mjs
          else
            echo "AI news agent is disabled in config.json — skipping."
          fi

      - name: Run Saudi stocks agent
        continue-on-error: true
        if: env.AGENT == 'both' || env.AGENT == 'saudi-stocks'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if node -e "process.exit(require('./config.json').agents['saudi-stocks'] === false ? 1 : 0)"; then
            node saudi-stocks-agent.mjs
          else
            echo "Saudi stocks agent is disabled in config.json — skipping."
          fi

      - name: Commit reports to the repo (archive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports || true
          git diff --cached --quiet || git commit -m "Daily reports $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push

      - name: Build site
        run: node build-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
